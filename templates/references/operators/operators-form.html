{% extends "layout_plain.html" %}


{% block content %}


 <!-- BASIC FORM ELELEMNTS -->
      <div class="form-panel" style="margin:0">
          <form class="form-horizontal style-form" method="post">
{% if error %}
              {% for err_msg in error_msg %}
              <div>{{err_msg}}</div>
              {% endfor %}
{% endif %}

              <div class="form-group">
                  <label class="col-sm-2 col-sm-2 control-label">kode petugas</label>
                  <div class="col-sm-10">
                      <input type="text" class="form-control" name="code" value="{{ operator_kode }}">
                  </div>
              </div>
              <div class="form-group">
                  <label class="col-sm-2 col-sm-2 control-label">Nama</label>
                  <div class="col-sm-10">
                      <input type="text" class="form-control" name="name" value="{{ operator_name }}">
                  </div>
              </div>
              <div class="form-group">
                  <label class="col-sm-2 col-sm-2 control-label">Nomor wa</label>
                  <div class="col-sm-10">
                      <input type="text" class="form-control" name="phone" value="{{ operator_phone }}">
                  </div>
              </div>

              <div class="form-group">
                  <label class="col-sm-2 col-sm-2 control-label">fee</label>
                  <div class="col-sm-10">
                      <input type="text" class="form-control" name="fee" value="{{ operator_fee }}">
                  </div>
              </div>

              <div class="form-group">
                  <label class="col-sm-2 col-sm-2 control-label"> </label>
                  <div class="col-sm-10">
                   <button type="submit" class="btn btn-primary">Simpan</button>
                    </div>
              </div>
          </form>
      </div>





{% endblock %}
