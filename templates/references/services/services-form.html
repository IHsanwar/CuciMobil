{% extends "layout_plain.html" %}

{% block content %}

 <!-- BASIC FORM ELELEMNTS -->
      <div class="form-panel" style="margin:0">
          <form class="form-horizontal style-form" method="post">
              <div class="form-group">
                  <label class="col-sm-2 col-sm-2 control-label">kode</label>
                  <div class="col-sm-10">
                      <input type="text" class="form-control" name="code" value="{{ service_code }}">
                  </div>
              </div>
              <div class="form-group">
                  <label class="col-sm-2 col-sm-2 control-label">Nama</label>
                  <div class="col-sm-10">
                      <input type="text" class="form-control" name="name" value="{{  service_name }}">
                  </div>
              </div>
              <div class="form-group">
                  <label class="col-sm-2 col-sm-2 control-label">jumlah operator</label>
                  <div class="col-sm-10">
                      <input type="text" class="form-control" name="many_operators" value="{{ service_many_operators }}">
                  </div>
              </div>
              <div class="form-group">
                  <label class="col-sm-2 col-sm-2 control-label">harga</label>
                  <div class="col-sm-10">
                      <input type="text" class="form-control" name="price" value="{{ service_price }}">
                  </div>
              </div>



              <div class="form-group">
                  <label class="col-sm-2 col-sm-2 control-label"> </label>
                  <div class="col-sm-10">
                   <button type="submit" class="btn btn-primary">Simpan</button>
                    </div>
              </div>
          </form>
      </div>


{% endblock %}
