{% extends "layout.html" %}

{% block content %}


<div class="row mt">
      <div class="col-md-12">
          <div class="content-panel">
              <table class="table table-striped table-advance table-hover">

                <div >
                    <div style="float:left;"><h4>&nbsp; Data pelanggan</h4></div>
                    <div class="pull-right" style="padding-top:7px;padding-right:20px;">
                        <button class="btn btn-success " onclick="javscript:openModal(0)">Tambah</button>
                    </div>
                    <div style="clear:both"></div>
                </div>

<hr/>
                  <thead>
                  <tr>
                      <th width="15%"> Nopol</th>
                      <th width="28%"> Nama pemilik</th>
                      <th width="25%"> Nomor WA</th>
                      <th width="20%"> Jenis</th>
                      <th width="12%"></th>
                  </tr>
                  </thead>
                  <tbody>

                  {% for item in customers %}
                  <tr>
                      <td>{{ item.nopol }} </td>
                      <td>{{ item.owner }} </td>
                      <td>{{ item.phone }} </td>
                      <td>{{ item.vehicle_model }} </td>
                      <td align="right">
                          <button class="btn btn-success btn-xs"><i class="fa fa-check"></i></button>
                          <button class="btn btn-primary btn-xs"  onclick="javscript:openModal({{ item.id }})"><i class="fa fa-pencil"></i></button>
                          <button class="btn btn-danger btn-xs"><i class="fa fa-trash-o "></i></button>
                      </td>
                  </tr>
                 {% endfor %}

                  </tbody>
              </table>
          </div><!-- /content-panel -->
      </div><!-- /col-md-12 -->
  </div><!-- /row -->





<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Tambah data pelanggan</h5>
      </div>
      <div class="modal-body">
        <iframe src="/blankplain" id="testModalBox" width="100%" height="320px" style="border:0;overflow-y:scroll;overflow-x:hidden;" ></iframe>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" onclick="javascript:window.location.reload();">Close</button>
      </div>
    </div>
  </div>
</div>

<script type="text/javascript">
 function openModal(url){
	 if( url != '0'){
	 	$('#exampleModalLabel').html('Ubah data pelanggan')

	 }
	 $('#testModalBox').attr('src', '/customer_form?id=' + url)
	 $('#exampleModal').modal('show')
 }

</script>

{% endblock %}
